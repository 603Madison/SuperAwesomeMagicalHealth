# SuperAwesomeMagicalFitness server: `podman compose up -d` (or `docker compose up -d`).
# Everything it keeps (accounts, health data, food log, saved sign-ins, its encryption key) is in ./data.
services:
  superawesomemagicalfitness:
    image: ghcr.io/603madison/superawesomemagicalfitness:latest
    container_name: superawesomemagicalfitness
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      # :Z relabels the folder for SELinux (Fedora, RHEL); harmless elsewhere.
      - ./data:/data:Z
    environment:
      # The address people use, needed for single sign-on behind a reverse proxy.
      # SAMF_PUBLIC_URL: https://fitness.example.com
      # SAMF_TRUST_PROXY: "true"
      # Behind Cloudflare, so each visitor's own address is known:
      # SAMF_CLIENT_IP_HEADER: CF-Connecting-IP
      # The break-glass admin's first password (otherwise one is generated and logged once).
      # SAMF_ADMIN_PASSWORD: change-me-please
      # Single sign-on with Authentik, if you'd rather set it here than on the admin page:
      # SAMF_OIDC_ISSUER: https://auth.example.com/application/o/superawesomemagicalfitness/
      # SAMF_OIDC_CLIENT_ID: ...
      # SAMF_OIDC_CLIENT_SECRET: ...
      # SAMF_OIDC_USER_GROUP: fitness-users
      # SAMF_OIDC_ADMIN_GROUP: fitness-admins
      TZ: America/New_York
