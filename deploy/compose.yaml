# SuperAwesomeMagicalHealth server: `podman compose up -d` (or `docker compose up -d`).
# Everything it keeps (accounts, health data, food log, saved sign-ins, its encryption key) is in ./data.
services:
  superawesomemagicalhealth:
    image: ghcr.io/603madison/superawesomemagicalhealth:latest
    container_name: superawesomemagicalhealth
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      # :Z relabels the folder for SELinux (Fedora, RHEL); harmless elsewhere.
      - ./data:/data:Z
    environment:
      # The address people use, needed for single sign-on behind a reverse proxy.
      # SAMH_PUBLIC_URL: https://health.example.com
      # SAMH_TRUST_PROXY: "true"
      # Behind Cloudflare, so each visitor's own address is known:
      # SAMH_CLIENT_IP_HEADER: CF-Connecting-IP
      # The break-glass admin's first password (otherwise one is generated and logged once).
      # SAMH_ADMIN_PASSWORD: change-me-please
      # Single sign-on with Authentik, if you'd rather set it here than on the admin page:
      # SAMH_OIDC_ISSUER: https://auth.example.com/application/o/superawesomemagicalhealth/
      # SAMH_OIDC_CLIENT_ID: ...
      # SAMH_OIDC_CLIENT_SECRET: ...
      # SAMH_OIDC_USER_GROUP: health-users
      # SAMH_OIDC_ADMIN_GROUP: health-admins
      TZ: America/New_York
