name: Release

# Builds the signed APK and the Pebble watch app and publishes them as a GitHub release, with notes from
# release-notes/<version>.md, and publishes the server's container image to
# ghcr.io/<owner>/superawesomemagicalhealth. Start it from the Actions tab ("Run workflow") with the version,
# or push a v* tag. The release's tag is created on the built commit if it doesn't exist yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0 (must match versionName in android/build.gradle.kts)
        required: true
      commit:
        description: Commit to build (defaults to the selected branch's latest commit)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Check version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/build.gradle.kts)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::$TAG doesn't match versionName $VERSION_NAME in android/build.gradle.kts"
            exit 1
          fi
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every release must be signed with the same key, or installed copies can't be updated
      # (see CLAUDE.md). It lives in repository secrets, never in git.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions > Repository secrets (see CLAUDE.md for making the key)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The keystore couldn't be opened: check that RELEASE_KEYSTORE_BASE64 was pasted completely and the password matches"
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          node --test pebble/test/*.test.js
          ./gradlew --no-daemon :android:testDebugUnitTest :server:test

      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :android:assembleRelease
          cp android/build/outputs/apk/release/android-release.apk "SuperAwesomeMagicalHealth-$TAG.apk"
          sha256sum SuperAwesomeMagicalHealth-*.apk

      - uses: astral-sh/setup-uv@v6
      # The watch app carries the same version as everything else (major.minor on the watch).
      - name: Build the watch app
        run: |
          uv tool install pebble-tool==5.2.0 --python 3.13
          PEBBLE="$(uv tool dir --bin)/pebble"
          "$PEBBLE" sdk install 4.44
          (cd pebble && npm pkg set version="${TAG#v}" && "$PEBBLE" build)
          cp pebble/build/pebble.pbw "SuperAwesomeMagicalHealth-watch-$TAG.pbw"
          sha256sum SuperAwesomeMagicalHealth-watch-*.pbw

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:release-notes/$TAG.md" > notes.md 2>/dev/null || echo "SuperAwesomeMagicalHealth $TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "SuperAwesomeMagicalHealth-$TAG.apk" "SuperAwesomeMagicalHealth-watch-$TAG.pbw" --clobber
          else
            gh release create "$TAG" "SuperAwesomeMagicalHealth-$TAG.apk" "SuperAwesomeMagicalHealth-watch-$TAG.pbw" --target "$COMMIT" --title "SuperAwesomeMagicalHealth $TAG" --notes-file notes.md
          fi

  # The F-Droid repository on GitHub Pages, with this release in it.
  fdroid:
    needs: release
    uses: ./.github/workflows/fdroid.yml
    secrets: inherit
    permissions:
      contents: write

  # The server and web app, for amd64 and arm64 (a Raspberry Pi), at
  # ghcr.io/<owner>/superawesomemagicalhealth:<version> and :latest, whatever the repository is called.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Image name and tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/superawesomemagicalhealth"
          VERSION="${TAG#v}"
          {
            echo "TAGS<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:${VERSION%.*}"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
