name: Checks

# Every push and pull request: the server's tests, the web app's type check and build, the
# Android app's tests, lint and debug APK, and the Pebble watch app's tests and build (the APK and
# the watch app are kept as build artifacts for a week).
on:
  push:
  pull_request:

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Server tests
        env:
          SAMH_SERVER_ONLY: "1"
        run: ./gradlew --no-daemon :server:test :server:installDist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and a debug APK
        run: ./gradlew --no-daemon :android:testDebugUnitTest :android:lintDebug :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAwesomeMagicalHealth-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/build/outputs/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  pebble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Watch app logic tests
        run: node --test pebble/test/*.test.js
      - uses: astral-sh/setup-uv@v6
      # The Pebble SDK from Core Devices (pebble-tool, then the SDK with its ARM toolchain),
      # pinned so builds are repeatable; raise both together.
      - name: Pebble SDK
        run: |
          uv tool install pebble-tool==5.2.0 --python 3.13
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          "$(uv tool dir --bin)/pebble" sdk install 4.44
      - name: Build the watch app
        working-directory: pebble
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAwesomeMagicalHealth-watch
          path: pebble/build/*.pbw
          retention-days: 7
