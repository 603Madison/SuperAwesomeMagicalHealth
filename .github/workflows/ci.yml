name: Checks

# Every push and pull request: the server's tests, the web app's type check and build, and the
# Android app's tests, lint and debug APK (kept as a build artifact for a week).
on:
  push:
  pull_request:

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Server tests
        env:
          SAMF_SERVER_ONLY: "1"
        run: ./gradlew --no-daemon :server:test :server:installDist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and a debug APK
        run: ./gradlew --no-daemon :android:testDebugUnitTest :android:lintDebug :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAwesomeMagicalFitness-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/build/outputs/screenshots/
          retention-days: 7
          if-no-files-found: ignore
